name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%232F3CFF&color_dots=%23ebedf0,%23ffc2e0,%23ff8fc4,%23ff4fa3,%23d6003f
            dist/snake-dark.svg?color_snake=%23C8FF00&color_dots=%232b2b30,%237a2a55,%23b33a7f,%23ff4fa3,%23ff9ccc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
