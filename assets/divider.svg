<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#C6FF3D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C6FF3D"/>
      <stop offset="1" stop-color="#C6FF3D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p { animation: run 4s cubic-bezier(.6,0,.4,1) infinite; }
    @keyframes run { from { transform: translateX(-300px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .p { animation: none; } }
  </style>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="#8B7BFF" stroke-opacity=".35" stroke-dasharray="1 7"/>
  <rect class="p" x="0" y="19" width="300" height="2" fill="url(#g)"/>
  <g fill="#8B7BFF" fill-opacity=".7">
    <rect x="596" y="16" width="8" height="8" transform="rotate(45 600 20)"/>
  </g>
</svg>
