    .tw { transform-box: fill-box; transform-origin: 50% 50%; animation: tw 1.2s steps(1) infinite; }
    .t1 { animation-delay: -.3s; } .t2 { animation-delay: -.6s; } .t3 { animation-delay: -.9s; } .t4 { animation-delay: -.15s; } .t5 { animation-delay: -.75s; }
    @keyframes tw { 0% { transform: scale(1) rotate(0deg); } 33% { transform: scale(.45) rotate(30deg); } 66% { transform: scale(.85) rotate(60deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
